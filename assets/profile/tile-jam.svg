<svg xmlns="http://www.w3.org/2000/svg" width="423" height="150" viewBox="0 0 423 150" role="img" aria-label="Jam: real-world asset platform.">
<title>Jam: Real-world asset platform</title>
<defs>
<clipPath id="card"><rect x="5" y="2" width="413" height="144" rx="12"/></clipPath>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>@font-face{font-family:JB;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JB;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:JB,ui-monospace,SFMono-Regular,Menlo,monospace}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.kb{transform-origin:211.5px 53px;animation:kb 9s ease-in-out -1.3s infinite alternate}
@keyframes sheen{0%,62%{transform:translateX(-423px) skewX(-18deg)}100%{transform:translateX(676.8000000000001px) skewX(-18deg)}}
.sheen{animation:sheen 7s cubic-bezier(.4,0,.2,1) 0.7s infinite backwards}
@media (prefers-reduced-motion:reduce){.kb,.sheen{animation:none!important}}
@media (prefers-reduced-motion:reduce){.sheen{opacity:0}}
</style>
<g clip-path="url(#card)">
<rect x="5" y="2" width="413" height="144" fill="#0d0f12"/>
<g class="kb"><image href="data:image/webp;base64," x="5" y="2" width="413" height="102" preserveAspectRatio="xMidYMid slice"/></g>

<rect class="sheen" x="0" y="2" width="148" height="102" fill="url(#sheen)"/>
<line x1="5" y1="104.5" x2="418" y2="104.5" stroke="#22262d"/>
</g>
<rect x="5.5" y="2.5" width="412" height="143" rx="11.5" fill="none" stroke="#22262d"/>
<text x="17" y="125" fill="#e6e8eb" font-size="12.5" font-weight="700" xml:space="preserve">Jam</text>
<text x="17" y="140" fill="#7d8590" font-size="9.5" xml:space="preserve">Real-world asset platform</text>
<rect x="351.2" y="114.5" width="54.8" height="15" rx="7.5" fill="none" stroke="#22262d"/>
<text x="378.6" y="125" fill="#b4bac3" font-size="8.5" text-anchor="middle" xml:space="preserve">showcase</text>
</svg>